    {name:'PBKDF2',salt:salt,iterations:iters,hash:'SHA-256'},base,512));
  const encKey=bits.slice(0,32), macKey=bits.slice(32);

  signed.set(salt,0); signed.set(ct,salt.length);
  const got=new Uint8Array(await C.sign('HMAC',mk,signed));
  if(!_eq(got,tag)) throw new Error('WRONG PASSWORD');

  const out=new Uint8Array(ct.length);
  for(let i=0,blk=0;i<ct.length;i+=32,blk++){

    new DataView(ctr.buffer).setBigUint64(0,BigInt(blk),false);
    const ks=new Uint8Array(await C.sign('HMAC',ek,ctr));
    for(let j=0;j<32&&i+j<ct.length;j++) out[i+j]=ct[i+j]^ks[j];
  }
  return new TextDecoder().decode(out);
